name: Publish to Maven Central

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish Artifacts
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Verify versions and publish to Maven Central
        # Credentials are injected as ORG_GRADLE_PROJECT_* env vars — Gradle automatically maps
        # these to project properties (equivalent to passing -P<name>=<value> on the command line).
        # Nothing is passed as a flag to the script; the script only receives --release.
        #
        # Required GitHub repository secrets:
        #   MAVEN_CENTRAL_USERNAME   — Central Portal user token username
        #                              from https://central.sonatype.com → Account → User Token
        #   MAVEN_CENTRAL_PASSWORD   — Central Portal user token password
        #   GPG_SIGNING_KEY          — base64-armored GPG private key
        #                              export: gpg --export-secret-keys --armor <KEY_ID> | base64
        #   GPG_KEY_PASSWORD         — passphrase for the GPG private key
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_KEY_PASSWORD }}
        run: ./scripts/check-and-publish.sh --release

  update_readme:
    name: Update README Version Badge
    runs-on: ubuntu-latest
    # Only runs after the publish job succeeds
    needs: publish
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Use a PAT so the push can trigger other workflows if needed,
          # or use the default GITHUB_TOKEN (which won't trigger workflows).
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Extract release version
        id: version
        # GitHub release tag name (e.g. "0.2.0" or "v0.2.0") — strip leading 'v' if present.
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Update version references in README.md
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"

          # Update kolt-catalog and kmp-catalog version references
          sed -i "s|kolt-catalog:[0-9]\+\.[0-9]\+\.[0-9]\+|kolt-catalog:${VERSION}|g" README.md
          sed -i "s|kmp-catalog:[0-9]\+\.[0-9]\+\.[0-9]\+|kmp-catalog:${VERSION}|g" README.md

      - name: Commit and push README changes
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          # Only commit if there are actual changes
          git diff --cached --quiet || git commit -m "chore: bump README version references to ${VERSION} [skip ci]"
          git push origin main
