name: Deploy Demo Docs to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'demo-web/**'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'demo-web/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'demo-web/package-lock.json'

      - name: Install Dependencies
        run: npm ci
        working-directory: demo-web

      - name: Build static files
        run: npm run build
        working-directory: demo-web

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KOLT_KMP }}
          projectId: kolt-kmp
          channelId: ${{ github.event_name == 'push' && 'live' || '' }}
          entryPoint: demo-web
